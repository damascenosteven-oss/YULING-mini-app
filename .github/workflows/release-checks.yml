name: release-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Receiver, rollback and bootstrap boundary tests
        run: sudo python3 -m unittest discover -s deploy/test -p '*_test.py' -v
      - name: Actual restricted SSH entry and Docker rollback
        run: python3 deploy/test/receiver-integration.py --output "$RUNNER_TEMP/receiver-entry"
      - name: Build without deployment credentials
        run: python3 deploy/test/build-image.py --development --output "$RUNNER_TEMP/release-check"
      - name: Verify packaged runtime and repeatability
        run: python3 deploy/test/verify-image.py --build-output "$RUNNER_TEMP/release-check"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-check-evidence
          path: |
            ${{ runner.temp }}/release-check/packaged-candidate
            ${{ runner.temp }}/release-check/image-memory.txt
            ${{ runner.temp }}/receiver-entry/result.json
            ${{ runner.temp }}/receiver-entry/fixture-docker-errors.log
          retention-days: 7
          if-no-files-found: warn
