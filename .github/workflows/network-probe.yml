name: PPT 网络测速

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppt-test-server
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ppt-test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install hash-pinned diagnostic SDK in separate environment
        run: |
          python3 -m venv "$RUNNER_TEMP/probe-venv"
          "$RUNNER_TEMP/probe-venv/bin/python" -m pip install --require-hashes -r deploy/test/requirements-probe-build.txt
          "$RUNNER_TEMP/probe-venv/bin/python" -m pip install --no-build-isolation --require-hashes -r deploy/test/requirements-probe.txt
      - name: Measure three bounded paths; never publish
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PROBE_COS_SECRET_ID: ${{ secrets.PROBE_COS_SECRET_ID }}
          PROBE_COS_SECRET_KEY: ${{ secrets.PROBE_COS_SECRET_KEY }}
        run: '"$RUNNER_TEMP/probe-venv/bin/python" deploy/test/network-probe.py --output "$RUNNER_TEMP/network-probe"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ppt-network-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-probe/
          retention-days: 7
          if-no-files-found: warn
